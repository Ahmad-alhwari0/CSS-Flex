<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="grid.css">
    <title>grid</title>
</head>
<body>
    <div class="container">

        <div class="box">Item 1</div>

        <div class="box grid-2x2">
            <div class="sub">Sub 1</div>
            <div class="sub">Sub 2</div>
            <div class="sub">Sub 3</div>
            <div class="sub">Sub 4</div>
        </div>

        <div class="box grid-2x2">
            <div class="sub">Sub 1</div>
            <div class="sub">Sub 2</div>
            <div class="sub">Sub 3</div>
            <div class="sub">Sub 4</div>
        </div>

        <div class="box">Item 4</div>

        <div class="box">Item 5</div>

        <div class="box grid-stack">
            <div class="sub">Sub 1</div>
            <div class="sub">Sub 2</div>
        </div>

        <div class="box grid-side">
            <div class="sub">Sub 1</div>
            <div class="sub">Sub 2</div>
        </div>

        <div class="box">Item 8</div>

        <div class="box grid-2x2">
            <div class="sub">Sub 1</div>
            <div class="sub">Sub 2</div>
            <div class="sub">Sub 3</div>
            <div class="sub">Sub 4</div>
        </div>

        <div class="box">Item 10</div>

        <div class="box">Item 11</div>

        <div class="box grid-2x2">
            <div class="sub">Sub 1</div>
            <div class="sub">Sub 2</div>
            <div class="sub">Sub 3</div>
            <div class="sub">Sub 4</div>
        </div>

    </div>
</body>
</html>
